# ZUNTO! - Configuração Editorial e Scoring de Viralidade (TikTok)
weights:
  views: 0.25
  engagement_ratio: 0.45
  velocity_24h: 0.30

engagement_multipliers:
  likes: 1.0
  comments: 2.0
  shares: 3.0

thresholds:
  min_views: 1000
  reference_views: 100000
  reference_velocity_per_hour: 5000
  min_duration_seconds: 15
  max_duration_seconds: 180

discovery:
  default_limit: 30
  hashtags:
    - "curiosidades"
    - "ciencia"
    - "tecnologia"
    - "misterios"
    - "descobertas"
    - "fatosdesconhecidos"
    - "vocesabia"
  seed_accounts:
    - "vocesabia"
    - "cienciatododia"
    - "curiosidadesdomundo"
    - "manualdomundo"
    - "fatosdesconhecidos"
  search_queries:
    - "curiosidades que você não sabia"
    - "descobertas científicas misteriosas"
    - "fatos chocantes de ciência e tecnologia"
    - "mistérios do universo explicados"
